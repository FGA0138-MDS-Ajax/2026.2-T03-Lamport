services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sintoniza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sintoniza}
      POSTGRES_DB: ${POSTGRES_DB:-sintoniza}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sintoniza}:${POSTGRES_PASSWORD:-sintoniza}@db:5432/${POSTGRES_DB:-sintoniza}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
