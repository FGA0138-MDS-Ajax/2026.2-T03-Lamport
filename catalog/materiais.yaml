- slug: saude-mental-ms
  titulo: Saúde Mental – Saúde de A a Z
  url: https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/s/saude-mental
  fonte: Ministério da Saúde
  resumo: >-
    Explica o que é saúde mental e como o corpo, as emoções, as relações e as condições de
